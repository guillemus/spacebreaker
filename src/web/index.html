<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#05030c">
	<title>STARBREAKER</title>
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #05030c; }
		canvas { display: block; width: 100vw; height: 100vh; outline: none; cursor: none; }
		#boot {
			position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
			background: radial-gradient(ellipse at 50% 55%, #1b0f38 0%, #07040f 60%, #030208 100%);
			color: #8ff3ff; font: 600 12px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .45em;
			transition: opacity .7s ease, visibility .7s ease;
		}
		#boot.hide { opacity: 0; visibility: hidden; }
		#boot .bar { width: 220px; height: 2px; background: #8ff3ff22; overflow: hidden; }
		#boot .bar i { display: block; width: 40%; height: 100%; background: #8ff3ff; box-shadow: 0 0 12px #8ff3ff; animation: scan 1.1s ease-in-out infinite; }
		#boot.error { color: #ff7b8a; }
		@keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="-1"></canvas>
	<div id="boot"><div class="bar"><i></i></div><span id="boot-text">IGNITING REACTOR</span></div>
	<script src="odin.js"></script>
	<script src="sfx.js"></script>
	<script>
		const canvas = document.getElementById('canvas');
		const boot = document.getElementById('boot');
		const bootText = document.getElementById('boot-text');
		const block = e => e.preventDefault();
		window.addEventListener('contextmenu', block);
		canvas.addEventListener('mousedown', () => canvas.focus());

		const odinMemory = new odin.WasmMemoryInterface();
		odinMemory.setIntSize(4);
		const odinImports = odin.setupDefaultImports(odinMemory);
		let game = null;

		function fail(err) {
			console.error(err);
			boot.classList.remove('hide');
			boot.classList.add('error');
			bootText.textContent = 'REACTOR FAILURE — RELOAD';
		}

		var Module = {
			canvas,
			print: (...args) => console.log(...args),
			printErr: (...args) => console.warn(...args),
			instantiateWasm(imports, done) {
				WebAssembly.instantiateStreaming(fetch('index.wasm'), { ...odinImports, ...imports })
					.then(out => {
						const exports = out.instance.exports;
						odinMemory.setExports(exports);
						odinMemory.setMemory(exports.memory);
						game = exports;
						done(out.instance);
					})
					.catch(fail);
				return {};
			},
			onRuntimeInitialized() {
				try {
					game._start();
					game.main_start(window.innerWidth, window.innerHeight);
				} catch (err) {
					fail(err);
					return;
				}
				boot.classList.add('hide');
				window.addEventListener('blur', () => game.main_blur());
				document.addEventListener('visibilitychange', () => { if (document.hidden) game.main_blur(); });
				const frame = () => {
					game.main_update();
					requestAnimationFrame(frame);
				};
				requestAnimationFrame(frame);
			},
		};
		window.addEventListener('error', e => fail(e.error || e.message));
	</script>
	{{{ SCRIPT }}}
</body>
</html>
